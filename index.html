<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PopFlipariz - Estúdio de Animação FBF</title>
  
  <!-- Estilos organizados na pasta css -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Cabeçalho do Estúdio -->
  <header>
    <h1>✨ PopFlipariz ✨</h1>
    <span style="font-size: 0.8rem; color: #7a5c65;">PopPink Studio</span>
  </header>

  <!-- Área de Trabalho (Workspace) com o Canvas de Desenho -->
  <main class="workspace">
    <div class="canvas-container" id="canvasContainer">
      <!-- Resolução interna de desenho otimizada para performance -->
      <canvas id="paintCanvas" width="800" height="600"></canvas>
    </div>
  </main>

  <!-- Barra de Ferramentas Inferior -->
  <footer class="toolbar">
    <div class="tool-group">
      <button id="btnPincel" class="active">✏️ Pincel</button>
      <button id="btnBorracha">🧹 Borracha</button>
      <button id="btnLimpar">🗑️ Limpar</button>
    </div>

    <div class="tool-group">
      <input type="color" id="colorPicker" value="#ff69b4" title="Cor do Pincel">
    </div>

    <div class="tool-group">
      <label for="brushSize">Tamanho: <span id="sizeVal">5</span>px</label>
      <input type="range" id="brushSize" min="1" max="50" value="5">
    </div>
  </footer>

  <!-- Script principal modular (gerencia os eventos e o motor de pincel) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
