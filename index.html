<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopFlipariz - Estúdio de Animação FBF</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <!-- Barra Superior / Menu de Arquivo e Ferramentas Globais -->
    <header id="top-bar">
      <div class="logo">🎬 <span>PopFlipariz</span></div>
      
      <div class="top-controls">
        <!-- Área de Arquivo 📄 -->
        <div class="group">
          <input type="text" id="inputNomeObra" value="Minha Animacao PopFlip" placeholder="Nome da Obra">
          <button id="btnNovoProjeto" title="Novo Projeto">📄 Novo</button>
          <button id="btnExportar" title="Exportar / Baixar">💾 Exportar</button>
        </div>

        <!-- Área de Desfazer e Refazer ↩️ ↪️ -->
        <div class="group">
          <button id="btnDesfazer" title="Desfazer (Ctrl+Z)">↩️</button>
          <button id="btnRefazer" title="Refazer (Ctrl+Y)">↪️</button>
        </div>

        <!-- Área de Zoom 🔍 -->
        <div class="group">
          <button id="btnZoomIn" title="Zoom In (I)">🔍+</button>
          <button id="btnZoomOut" title="Zoom Out (O)">🔍-</button>
          <button id="btnZoomReset" title="Restaurar Zoom">100%</button>
        </div>
      </div>
    </header>

    <div id="main-workspace">
      <!-- Barra Lateral de Ferramentas -->
      <aside id="toolbar">
        <button id="btnPincel" class="active" title="Pincel (B)">✏️ Pincel</button>
        <button id="btnBorracha" title="Borracha (E)">🧹 Borracha</button>
        <button id="btnBalde" title="Balde de Tinta">🪣 Balde</button>
        <button id="btnFormas" title="Formas Geométricas">⭕ Formas</button>
        <button id="btnSelecao" title="Laço de Seleção">🤠 Seleção</button>
        <button id="btnMaozinha" title="Mãozinha / Pan (Espaço)">🤚 Mãozinha</button>
        
        <hr>

        <!-- Área de Cores 🎨 -->
        <div class="color-picker-section">
          <label for="pickerCorPrimaria">Cor Primária</label>
          <input type="color" id="pickerCorPrimaria" value="#ff69b4">
          <button id="btnTrocarCores" title="Trocar Primária/Secundária">🔄 Swap</button>
          <button id="btnContaGotas" title="Conta-Gotas">🧪</button>
        </div>

        <hr>

        <!-- Propriedades Avançadas do Pincel 🖌️ -->
        <div class="brush-properties-section" style="display: flex; flex-direction: column; gap: 8px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">⚙️ Definições do Pincel</span>
          
          <label>Tamanho (1 - 200): 
            <input type="number" id="inputTamanho" value="8.0" min="0.1" max="200.0" step="0.1" style="width: 100%;">
          </label>

          <label>Opacidade (0.05 - 1.0): 
            <input type="number" id="inputOpacidade" value="1.0" min="0.05" max="1.0" step="0.05" style="width: 100%;">
          </label>

          <label>Estabilizador (0 - 10): 
            <input type="number" id="inputEstabilizador" value="0" min="0" max="10" step="1" style="width: 100%;">
          </label>

          <label>Tipo de Pincel: 
            <select id="selectTipoPincel" style="width: 100%; margin-top: 2px; padding: 3px; background: #252530; color: #fff; border: 1px solid #444;">
              <option value="normal">Normal (Suave)</option>
              <option value="pixel">Pixel Art</option>
              <option value="spray">Spray (Aerógrafo)</option>
              <option value="borradinho">Borradinho</option>
              <option value="aquarela">Aquarela</option>
              <option value="bico_de_pena">Caneta Bico de Pena</option>
              <option value="laco">Pincel Laço (Preenchimento)</option>
            </select>
          </label>
        </div>

        <hr>

        <!-- Propriedades Avançadas da Borracha 🧹 -->
        <div class="eraser-properties-section" style="display: flex; flex-direction: column; gap: 8px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">🧹 Definições da Borracha</span>
          
          <label>Tamanho (0 - 400): 
            <input type="number" id="inputTamanhoBorracha" value="20" min="0" max="400" step="1" style="width: 100%;">
          </label>

          <label>Opacidade (0.05 - 1.0): 
            <input type="number" id="inputOpacidadeBorracha" value="1.0" min="0.05" max="1.0" step="0.05" style="width: 100%;">
          </label>

          <label>Forma da Borracha: 
            <select id="selectFormaBorracha" style="width: 100%; margin-top: 2px; padding: 3px; background: #252530; color: #fff; border: 1px solid #444;">
              <option value="round">Redonda</option>
              <option value="square">Quadrada</option>
            </select>
          </label>

          <label>Tipo da Borracha: 
            <select id="selectTipoBorracha" style="width: 100%; margin-top: 2px; padding: 3px; background: #252530; color: #fff; border: 1px solid #444;">
              <option value="normal">Normal (Borda Firme)</option>
              <option value="soft">Borradinha / Esfumaçada</option>
            </select>
          </label>
        </div>
      </aside>

      <!-- Área de Visualização do Canvas / Workspace principal -->
      <main id="viewport">
        <div id="canvas-container">
          <!-- Os canvas das camadas serão injetados dinamicamente pelo LayerManager -->
        </div>
      </main>

      <!-- Painel Direito: Camadas e Configurações -->
      <aside id="right-panel">
        <section id="layer-section">
          <h3>🗂️ Camadas</h3>
          <div class="layer-actions">
            <button id="btnAddCamada">+ Nova</button>
            <button id="btnDuplicarCamada">📋 Duplicar</button>
            <button id="btnFundirCamada">⬇️ Fundir</button>
            <button id="btnRemoverCamada">🗑️ Excluir</button>
          </div>
          <ul id="listaCamadas"></ul>
        </section>
      </aside>
    </div>

    <!-- Barra Inferior: Área de Animação FBF 🎬 -->
    <footer id="timeline-bar">
      <div class="playback-controls">
        <button id="btnPlayPause">▶️ Play</button>
        <label>FPS: <input type="number" id="inputFPS" value="12" min="1" max="60"></label>
        <label><input type="checkbox" id="chkLoop" checked> Loop</label>
        <label><input type="checkbox" id="chkCascaCebola"> Casca de Cebola</label>
      </div>

      <div class="frame-controls">
        <button id="btnAddFrameDir">+ Frame ➡️</button>
        <button id="btnAddFrameEsq">⬅️ + Frame</button>
        <button id="btnDuplicarFrame">📋 Duplicar Frame</button>
        <button id="btnExcluirFrame">🗑️ Excluir Frame</button>
      </div>

      <div id="timeline-frames-container">
        <!-- Os quadros (frames) serão renderizados aqui -->
      </div>
    </footer>
  </div>

  <!-- Script Principal Módulo ES6 -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
