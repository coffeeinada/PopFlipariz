<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopFlipariz - Estúdio de Animação FBF</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <!-- Barra Superior -->
    <header id="top-bar">
      <div class="logo">🎬 <span>PopFlipariz</span></div>
      
      <div class="top-controls">
        <div class="group">
          <input type="text" id="inputNomeObra" value="Minha Animacao PopFlip" placeholder="Nome da Obra">
          <button id="btnNovoProjeto" title="Novo Projeto">📄 Novo</button>
          <button id="btnExportar" title="Exportar / Baixar">💾 Exportar</button>
        </div>

        <div class="group">
          <button id="btnDesfazer" title="Desfazer (Ctrl+Z)">↩️</button>
          <button id="btnRefazer" title="Refazer (Ctrl+Y)">↪️</button>
        </div>

        <!-- Controles de Zoom e Rotação 🔍🔄 -->
        <div class="group">
          <button id="btnZoomIn" title="Zoom In (I)">🔍+</button>
          <button id="btnZoomOut" title="Zoom Out (O)">🔍-</button>
          <button id="btnZoomReset" title="Restaurar Zoom">100%</button>
          <button id="btnGirarEsq" title="Girar Tela Esquerda (-15°)">↺ -15°</button>
          <button id="btnGirarDir" title="Girar Tela Direita (+15°)">↻ +15°</button>
        </div>
      </div>
    </header>

    <div id="main-workspace">
      <!-- Barra Lateral de Ferramentas -->
      <aside id="toolbar">
        <button id="btnPincel" class="active" title="Pincel (B)">✏️ Pincel</button>
        <button id="btnBorracha" title="Borracha (E)">🧹 Borracha</button>
        <button id="btnBalde" title="Balde de Tinta">🪣 Balde</button>
        <button id="btnFormas" title="Formas Geométricas">⭕ Formas</button>
        <button id="btnSelecao" title="Laço de Seleção">🤠 Seleção</button>
        <button id="btnTransformar" title="Transformar Seleção/Conteúdo">🔲 Transformar</button>
        <button id="btnMaozinha" title="Mover / Pan (Espaço)">🤚 Mover</button>
        <button id="btnPontoFuga" title="Ponto de Fuga & Grade">📐 Ponto de Fuga</button>
        
        <hr>

        <!-- Cores -->
        <div class="color-picker-section" style="display: flex; flex-direction: column; gap: 6px;">
          <label for="pickerCorPrimaria">Cor Primária / Contorno</label>
          <input type="color" id="pickerCorPrimaria" value="#ff69b4">
          <button id="btnTrocarCores" title="Trocar Primária/Secundária">🔄 Swap</button>
        </div>

        <hr>

        <!-- Paletas -->
        <div class="palette-section" style="display: flex; flex-direction: column; gap: 6px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">🎨 Paletas de Cores</span>
          <div style="display: flex; gap: 4px;">
            <select id="selectPaleta" style="flex: 1;"></select>
            <button id="btnNovaPaleta" title="Criar Nova Paleta">➕</button>
            <button id="btnExcluirPaleta" title="Excluir Paleta Atual">🗑️</button>
          </div>
          <div style="display: flex; gap: 4px;">
            <button id="btnExportarPaletas" style="flex: 1;">📤 Exportar</button>
            <button id="btnImportarPaletas" style="flex: 1;">📥 Importar</button>
            <input type="file" id="inputImportarPaletas" accept=".json" style="display: none;">
          </div>
          <div id="paleta-cores-container" style="display: flex; flex-wrap: wrap; gap: 4px; max-height: 80px; overflow-y: auto; background: #1a1a24; padding: 5px; border-radius: 4px; border: 1px solid #333;"></div>
          <div style="display: flex; gap: 4px;">
            <button id="btnAddCorPaleta" style="flex: 1;">➕ Criar Cor</button>
            <button id="btnSubstituirCor" style="flex: 1;">🔄 Substituir</button>
            <button id="btnRemoverCor" style="flex: 1;">❌ Apagar</button>
          </div>
        </div>

        <hr>

        <!-- Painel Seleção -->
        <div id="panelSelecao" class="selecao-section" style="display: none; flex-direction: column; gap: 8px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">🤠 Definições de Seleção</span>
          <label>Modo de Seleção:
            <select id="selectModoSelecao" style="width: 100%;">
              <option value="quadrado">Quadrado / Retângulo</option>
              <option value="circulo">Círculo / Elipse</option>
              <option value="laco">Laço Livre</option>
              <option value="linha_reta">Caminho de Linha Reta</option>
              <option value="balde_selecao">Balde de Seleção (Varinha)</option>
            </select>
          </label>
          <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;">
            <button id="btnSelecionarTudo" style="flex: 1 1 45%;">🔲 Tudo</button>
            <button id="btnInverterSelecao" style="flex: 1 1 45%;">🔄 Inverter</button>
            <button id="btnLimparSelecao" style="flex: 1 1 45%;">❌ Limpar</button>
            <button id="btnPreencherSelecao" style="flex: 1 1 45%;">🎨 Preencher</button>
          </div>
        </div>

        <!-- Painel Transformar -->
        <div id="panelTransformar" class="transformar-section" style="display: none; flex-direction: column; gap: 8px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">🔲 Transformação de Conteúdo</span>
          <label>Modo:
            <select id="selectModoTransformacao" style="width: 100%;">
              <option value="padrao">Mover / Redimensionar / Girar</option>
              <option value="perspectiva">Perspetiva (9 Pontos)</option>
              <option value="corte">Cortar / Expandir Tela</option>
            </select>
          </label>
          <div style="display: flex; gap: 4px; margin-top: 4px;">
            <button id="btnAplicarTransformacao" style="flex: 1; background: #2e7d32; color: #fff; font-weight: bold;">✅ Aplicar (Enter)</button>
            <button id="btnCancelarTransformacao" style="flex: 1; background: #c62828; color: #fff;">❌ Cancelar</button>
          </div>
        </div>

        <hr>

        <!-- Ponto de Fuga -->
        <div id="panelPontoFuga" class="ponto-fuga-section" style="display: none; flex-direction: column; gap: 8px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">📐 Ponto de Fuga & Grade</span>
          <label><input type="checkbox" id="chkAtivarGrade" checked> Ativar Grade</label>
          <label><input type="checkbox" id="chkAtivarPontoFuga" checked> Ativar Ponto de Fuga</label>
          <label>Cor do Traçado: <input type="color" id="pickerCorGuia" value="#00ffff" style="width: 100%; height: 22px;"></label>
          <label>Largura (1 - 10): <input type="number" id="inputLarguraGuia" value="1.0" min="1" max="10" step="1" style="width: 100%;"></label>
          <label>Quantidade de Linhas (2 - 40): <input type="number" id="inputQtdLinhasFuga" value="16" min="2" max="40" step="1" style="width: 100%;"></label>
        </div>

        <!-- Propriedades de Formas -->
        <div class="shapes-properties-section" style="display: flex; flex-direction: column; gap: 8px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">⭕ Definições de Formas</span>
          <label><input type="checkbox" id="chkFormaBorracha"> Modo Borracha</label>
          <label>Forma: 
            <select id="selectTipoForma" style="width: 100%;">
              <option value="circulo">Círculo / Elipse</option>
              <option value="poligono">Polígono (3 a 10 Pontas)</option>
              <option value="linha">Linha Reta Simples</option>
              <option value="curva">Linha Curvada (Suave)</option>
            </select>
          </label>
          <label id="containerPontosPoligono">Pontos (3 - 10): <input type="number" id="inputPontosPoligono" value="4" min="3" max="10" step="1" style="width: 100%;"></label>
          <label><input type="checkbox" id="chkPreenchimentoForma" checked> Preencher</label>
          <label>Cor do Preenchimento: <input type="color" id="pickerPreenchimento" value="#ffb6c1" style="width: 100%; height: 22px; border: none; background: none; cursor: pointer;"></label>
          <label>Largura da Linha: <input type="number" id="inputLarguraLinha" value="4.0" min="0.1" max="200.0" step="0.1" style="width: 100%;"></label>
          <label>Opacidade: <input type="number" id="inputOpacidadeForma" value="1.0" min="0.05" max="1.0" step="0.05" style="width: 100%;"></label>
          <div style="display: flex; gap: 4px; margin-top: 4px;">
            <button id="btnConfirmarForma" style="flex: 1; background: #2e7d32; color: #fff; font-weight: bold;">✅ Fixar (Enter)</button>
            <button id="btnCancelarForma" style="flex: 1; background: #c62828; color: #fff;">❌ Cancelar</button>
          </div>
        </div>

        <hr>

        <!-- Propriedades do Balde -->
        <div class="bucket-properties-section" style="display: flex; flex-direction: column; gap: 8px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">🪣 Definições do Balde</span>
          <label><input type="checkbox" id="chkBaldeBorracha"> Modo Borracha</label>
          <label>Opacidade: <input type="number" id="inputBaldeOpacidade" value="1.0" min="0.05" max="1.0" step="0.05" style="width: 100%;"></label>
          <label>Tolerância (0 - 255): <input type="number" id="inputBaldeTolerancia" value="32" min="0" max="255" step="1" style="width: 100%;"></label>
          <label>Expandir (0 - 7): <input type="number" id="inputBaldeExpandir" value="0.0" min="0.0" max="7.0" step="0.1" style="width: 100%;"></label>
          <label>Amostragem: 
            <select id="selectBaldeAmostragem" style="width: 100%;">
              <option value="atual">Camada Atual</option>
              <option value="todas">Todas as Camadas</option>
            </select>
          </label>
        </div>

        <hr>

        <!-- Pincel -->
        <div class="brush-properties-section" style="display: flex; flex-direction: column; gap: 8px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">⚙️ Definições do Pincel</span>
          <label>Tamanho (1 - 200): <input type="number" id="inputTamanho" value="8.0" min="0.1" max="200.0" step="0.1" style="width: 100%;"></label>
          <label>Opacidade: <input type="number" id="inputOpacidade" value="1.0" min="0.05" max="1.0" step="0.05" style="width: 100%;"></label>
          <label>Estabilizador (0 - 10): <input type="number" id="inputEstabilizador" value="0" min="0" max="10" step="1" style="width: 100%;"></label>
          <label>Tipo de Pincel: 
            <select id="selectTipoPincel" style="width: 100%;">
              <option value="normal">Normal (Suave)</option>
              <option value="pixel">Pixel Art</option>
              <option value="spray">Spray (Aerógrafo)</option>
              <option value="borradinho">Borradinho</option>
              <option value="aquarela">Aquarela</option>
              <option value="bico_de_pena">Caneta Bico de Pena</option>
              <option value="laco">Pincel Laço (Preenchimento)</option>
            </select>
          </label>
        </div>

        <hr>

        <!-- Borracha -->
        <div class="eraser-properties-section" style="display: flex; flex-direction: column; gap: 8px; font-size: 11px;">
          <span style="font-weight: bold; color: #ff69b4;">🧹 Definições da Borracha</span>
          <label>Tamanho (0 - 400): <input type="number" id="inputTamanhoBorracha" value="20" min="0" max="400" step="1" style="width: 100%;"></label>
          <label>Opacidade: <input type="number" id="inputOpacidadeBorracha" value="1.0" min="0.05" max="1.0" step="0.05" style="width: 100%;"></label>
          <label>Forma: 
            <select id="selectFormaBorracha" style="width: 100%;">
              <option value="round">Redonda</option>
              <option value="square">Quadrada</option>
            </select>
          </label>
          <label>Tipo: 
            <select id="selectTipoBorracha" style="width: 100%;">
              <option value="normal">Normal (Borda Firme)</option>
              <option value="soft">Borradinha / Esfumaçada</option>
            </select>
          </label>
        </div>
      </aside>

      <!-- Workspace -->
      <main id="viewport">
        <div id="canvas-container"></div>
      </main>

      <!-- Painel Direito: Camadas -->
      <aside id="right-panel">
        <section id="layer-section">
          <h3>🗂️ Camadas & Pastas</h3>
          <div class="layer-actions">
            <button id="btnAddCamada">+ Camada</button>
            <button id="btnAddPasta">📁 + Pasta</button>
            <button id="btnDuplicarCamada">📋 Duplicar</button>
            <button id="btnRemoverCamada">🗑️ Excluir</button>
            <button id="btnLimparCamada">🧹 Limpar</button>
            <button id="btnEspelharH" title="Espelhar Horizontal">↔️ Espelhar H</button>
            <button id="btnEspelharV" title="Espelhar Vertical">↕️ Espelhar V</button>
          </div>

          <div style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; background: #252530; padding: 6px; border-radius: 4px; margin-top: 5px;">
            <label>Mesclagem: 
              <select id="selectBlendMode" style="width: 100%; margin-top: 2px;">
                <option value="source-over">Normal</option>
                <option value="darken">Escurecer</option>
                <option value="multiply">Multiplicar</option>
                <option value="color-burn">Superexposição de Cor</option>
                <option value="linear-burn">Subexposição Linear</option>
                <option value="lighten">Clarear</option>
                <option value="screen">Tela (Screen)</option>
                <option value="overlay">Sobrepor (Overlay)</option>
                <option value="difference">Diferença</option>
                <option value="exclusion">Exclusão</option>
                <option value="color-dodge">Subexposição</option>
                <option value="hard-light">Luz Dura</option>
                <option value="soft-light">Luz Suave</option>
                <option value="hue">Matiz</option>
                <option value="saturation">Saturação</option>
                <option value="color">Cor</option>
                <option value="luminosity">Luminosidade</option>
              </select>
            </label>
          </div>

          <ul id="listaCamadas"></ul>
        </section>
      </aside>
    </div>

    <!-- Timeline -->
    <footer id="timeline-bar">
      <div class="playback-controls">
        <button id="btnPlayPause">▶️ Play</button>
        <label>FPS: <input type="number" id="inputFPS" value="12" min="1" max="60" style="width: 45px;"></label>
        <label><input type="checkbox" id="chkLoop" checked> Loop</label>
        <label><input type="checkbox" id="chkCascaCebola"> Casca de Cebola</label>
      </div>

      <div class="frame-controls">
        <button id="btnAddFrameDir">+ Frame ➡️</button>
        <button id="btnAddFrameEsq">⬅️ + Frame</button>
        <button id="btnDuplicarFrame">📋 Duplicar Frame</button>
        <button id="btnExcluirFrame">🗑️ Excluir Frame</button>
      </div>

      <div id="timeline-frames-container"></div>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
