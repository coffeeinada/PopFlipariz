name: Deploy to Itch.io

on:
  push:
    branches: [ main ] # Altere para 'master' se a sua branch principal tiver esse nome

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Butler (Itch.io CLI)
        uses: jdno/setup-butler@v2

      - name: Enviar build para o Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Envia os ficheiros da raiz diretamente para o canal html5 do seu jogo no itch.io
          butler push . poppink-studio/popflipariz:html
